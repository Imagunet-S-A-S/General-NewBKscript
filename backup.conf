#!/bin/bash

################################################################################
# ARCHIVO DE CONFIGURACIÓN PARA SCRIPT DE BACKUP
################################################################################

# =====================================================================
# CONFIGURACIÓN DE DIRECTORIOS
# =====================================================================

export BACKUP_BASE_DIR="/backups"
export RETENTION_DAYS="21"

# =====================================================================
# CONFIGURACIÓN DE MARIADB / MYSQL
# =====================================================================

export MYSQL_USER="root"
export MYSQL_PASSWORD=""
export MYSQL_HOST="localhost"
export MYSQL_PORT="3306"

# =====================================================================
# CONFIGURACIÓN DE OPENSEARCH
# =====================================================================

export OPENSEARCH_HOST="localhost"
export OPENSEARCH_PORT="9200"

# DEBE existir en path.repo de opensearch.yml
export OPENSEARCH_SNAPSHOT_PATH="/var/lib/opensearch/snapshots"

# =====================================================================
# CONFIGURACIÓN DE JAEGER
# =====================================================================
# Jaeger usa OpenSearch como backend
# Sus datos quedan incluidos en el snapshot de OpenSearch

export JAEGER_HOME="/opt/jaeger"

# =====================================================================
# CONFIGURACIÓN DE AIRFLOW (SOLO POSTGRESQL)
# =====================================================================

export AIRFLOW_HOME="/opt/airflow"

export AIRFLOW_PG_DB="airflow"
export AIRFLOW_PG_USER="airflow"
export AIRFLOW_PG_HOST="localhost"
export AIRFLOW_PG_PORT="5432"

# Recomendado usar ~/.pgpass
export AIRFLOW_PG_PASSWORD=""

# =====================================================================
# LOGGING
# =====================================================================

export LOG_LEVEL="INFO"