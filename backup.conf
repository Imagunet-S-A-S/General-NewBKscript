#!/bin/bash
###############################################################################
# CONFIGURACIÓN DEL SISTEMA DE BACKUP – INFRAESTRUCTURA DE MONITOREO
###############################################################################

# ============================================================================
# POLÍTICA DE RETENCIÓN
# ============================================================================

# Días totales de retención (hot + warm)
export RETENTION_DAYS=21

# Días considerados "newest"
export HOT_DAYS=7

# ============================================================================
# AIRFLOW – METADATA DB (POSTGRESQL)
# ============================================================================

# Solo se usa si Airflow está instalado
# Recomendado usar ~/.pgpass para la contraseña

export AIRFLOW_PG_HOST="localhost"
export AIRFLOW_PG_PORT="5432"
export AIRFLOW_PG_DB="airflow"
export AIRFLOW_PG_USER="airflow"

# Si NO usas ~/.pgpass, puedes definirla aquí (no recomendado)
# export AIRFLOW_PG_PASSWORD=""

# Home de Airflow (solo filesystem)
export AIRFLOW_HOME="/opt/airflow"

# ============================================================================
# OPENSEARCH
# ============================================================================

# Host y puerto del cluster
export OPENSEARCH_HOST="localhost"
export OPENSEARCH_PORT="9200"

# Ruta definida en opensearch.yml -> path.repo
export OPENSEARCH_SNAPSHOT_PATH="/var/lib/opensearch/snapshots"

# ============================================================================
# MYSQL / MARIADB
# ============================================================================
# Si MariaDB está en un servidor remoto, ajusta MYSQL_HOST y MYSQL_PORT.
# Para conexión local por socket deja MYSQL_HOST vacío o "localhost".
# Recomendado: usar /etc/my.cnf o ~/.my.cnf para la contraseña en lugar de
# definirla aquí en texto plano.

export MYSQL_HOST="localhost"
export MYSQL_PORT="3306"
export MYSQL_USER="root"
export MYSQL_PASSWORD=""

# ============================================================================
# RUTAS POR SERVICIO
# ----------------------------------------------------------------------------
# REGLAS:
#   - Comentar una variable (# export ...) desactiva ese backup.
#   - Para agregar rutas adicionales usa la variable _EXTRA_DIRS del servicio.
#     Separa múltiples rutas con ":" (igual que $PATH).
#     Ejemplo: export GLPI_EXTRA_DIRS="/opt/mi-plugin:/srv/glpi-custom"
# ============================================================================

# ============================================================================
# ZABBIX
# ============================================================================
export ZABBIX_CFG_DIR="/etc/zabbix"
export ZABBIX_DATA_DIR="/var/lib/zabbix"

# Rutas adicionales (opcional):
# export ZABBIX_EXTRA_DIRS="/ruta/extra1:/ruta/extra2"

# ============================================================================
# GRAFANA
# ============================================================================
export GRAFANA_CFG_DIR="/etc/grafana"
export GRAFANA_DATA_DIR="/var/lib/grafana"

# Rutas adicionales (opcional):
# export GRAFANA_EXTRA_DIRS="/ruta/extra1:/ruta/extra2"

# ============================================================================
# GLPI
# ============================================================================
# Directorio de almacenamiento de backups (distinto de GLPI_DATA_DIR).
export GLPI_BACKUP_BASE="/var/backups/glpi"

# Directorio de la aplicación (código PHP).
#   Paquete debian/rpm: /usr/share/glpi
#   Instalación manual: /var/www/glpi
export GLPI_APP_DIR="/usr/share/glpi"

# Directorio de configuración
export GLPI_CFG_DIR="/etc/glpi"

# Directorio de datos (incluye files/, marketplace/, _uploads/, _pictures/)
# Los logs en /var/log/glpi NO se respaldan (archivos de auditoría, no críticos)
export GLPI_DATA_DIR="/var/lib/glpi"

# Rutas adicionales (opcional):
# export GLPI_EXTRA_DIRS="/ruta/extra1:/ruta/extra2"

# ============================================================================
# NOTAS
# ============================================================================
# - Este archivo debe estar en formato UNIX (LF)
# - Permisos recomendados: 600
# - No agregar espacios al final de las líneas
###############################################################################
